# The route table for ingress_http, delivered over filesystem RDS. Envoy
# re-reads this file when it changes, so editing it and hitting Refresh in the
# UI is the quickest way to watch the graph change.
#
# Bump version_info when you edit, so the detail pane shows the new version.
version_info: "1"
resources:
  - "@type": type.googleapis.com/envoy.config.route.v3.RouteConfiguration
    name: ingress_routes
    virtual_hosts:
      - name: app
        domains: ["*"]
        routes:
          # Terminal: answered by Envoy, so it has no cluster to link to.
          - name: health
            match: { path: /healthz }
            direct_response:
              status: 200
              body: { inline_string: "ok\n" }

          # Fans out to two clusters, which is the one route shape that makes
          # the graph branch.
          - name: api-canary
            match: { prefix: /api }
            route:
              weighted_clusters:
                clusters:
                  - { name: service_a, weight: 80 }
                  - { name: service_canary, weight: 20 }

          - name: catalog
            match: { prefix: /catalog }
            route: { cluster: catalog }

          # legacy_payments is not in bootstrap.yaml. This is the broken edge
          # the demo is pointing at: a route that cannot ever be served.
          - name: legacy
            match: { prefix: /legacy }
            route: { cluster: legacy_payments }

          - name: moved
            match: { prefix: /old }
            redirect:
              path_redirect: /api
              response_code: MOVED_PERMANENTLY

          - name: default
            match: { prefix: / }
            route: { cluster: service_b }
